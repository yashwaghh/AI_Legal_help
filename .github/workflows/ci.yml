name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      AUTH_MODE: development
      RATE_LIMIT_BACKEND: memory
      APP_CHECK_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75
      - run: node --check app/static/app.js
